name: Inspect AniGame public migration contract
on:
  pull_request:
    paths:
      - 'anigame_public_probe.py'
      - '.github/workflows/anigame-contract.yml'
permissions:
  contents: read
jobs:
  public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Read the public page in an empty browser
        run: xvfb-run -a -s "-screen 0 1280x720x24" python -u anigame_public_probe.py

