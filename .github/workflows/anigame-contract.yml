name: Inspect AniGame public migration contract
on:
  pull_request:
    paths:
      - 'anigame_public_probe.py'
      - '.github/workflows/anigame-contract.yml'
permissions:
  contents: read
jobs:
  public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read public page and its published JavaScript
        run: python anigame_public_probe.py
