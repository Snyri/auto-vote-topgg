name: Security Checks

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run tests
        env:
          REQUIRE_BROWSER_TESTS: '1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python ci_tests.py
          python -c 'import pathlib, py_compile; [py_compile.compile(str(path), doraise=True) for path in [*pathlib.Path(".").glob("*.py"), *pathlib.Path("scheduler").glob("*.py")]]'
          python -m pip check
          git diff --check

  free-flaresolverr:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Start pinned free service
        run: python flaresolverr_sidecar.py start --required
      - name: Verify container and Chrome session ownership
        run: |
          docker inspect topgg-free-flaresolverr --format '{{.Config.Image}} {{.Image}}'
          python check_flaresolverr.py
      - name: Remove service and all browser profiles
        if: always()
        run: python flaresolverr_sidecar.py stop

  scheduler-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build scheduler image
        run: docker build --build-arg BUILD_REVISION="${{ github.sha }}" -t topgg-scheduler-ci scheduler
      - name: Verify scheduler image runtime
        run: |
          docker run --rm -e GH_TOKEN=ci-placeholder -e GH_REPOSITORY=owner/repo --entrypoint python topgg-scheduler-ci -c 'import os, requests, scheduler; assert os.geteuid() != 0; assert requests.__version__ == "2.34.2"; assert scheduler.GH_WORKFLOW == "vote.yml"; assert scheduler.session.headers["Authorization"] == "Bearer ci-placeholder"'
          docker run --rm -v "$PWD:/tests:ro" -w /tests --entrypoint python topgg-scheduler-ci -m unittest -v test_scheduler

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Query OSV
        run: python audit_dependencies.py requirements.lock
