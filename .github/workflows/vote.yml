name: Top.gg Auto Vote
run-name: Top.gg Auto Vote · ${{ inputs.source || 'manual' }}${{ inputs.origin_run_id && format(' · {0}', inputs.origin_run_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: manual
        type: string
      origin_run_id:
        description: Original run id that requested an automatic fresh-run retry
        required: false
        default: ''
        type: string
      recovery_depth:
        description: Legacy recovery depth (accepted for compatibility; no limit)
        required: false
        default: '0'
        type: string

permissions: {}

concurrency:
  # All branches use the same accounts and must share the same voting lock.
  group: topgg-vote
  cancel-in-progress: false
  queue: max

jobs:
  vote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      vote_status: ${{ steps.run_vote.outputs.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo "No supported Chrome/Chromium executable found"; exit 1; }
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "Browser: $("$CHROME_BIN" --version)"
          echo "Xvfb: $(command -v Xvfb)"

      - name: Start free local FlareSolverr
        run: python flaresolverr_sidecar.py start

      - name: Restore vote handoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ORIGIN_ID: ${{ inputs.origin_run_id }}
          RECOVERY_MODE: restore
          RECOVERY_STATE_FILE: ${{ runner.temp }}/vote-recovery.json
        run: python action_recovery.py

      - name: Run vote
        id: run_vote
        env:
          TOKENS:                    ${{ secrets.TOKENS }}
          BOT_IDS:                   ${{ secrets.BOT_IDS }}
          TG_BOT_TOKEN:              ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:                ${{ secrets.TG_CHAT_ID }}
          SEND_ERROR_SCREENSHOTS:    ${{ secrets.SEND_ERROR_SCREENSHOTS }}
          TOPGG_COOKIES_JSON:        ${{ secrets.TOPGG_COOKIES_JSON }}
          RUN_SOURCE:                 ${{ inputs.source }}
          RUN_ORIGIN_ID:              ${{ inputs.origin_run_id }}
          RUN_RECOVERY_DEPTH:          ${{ inputs.recovery_depth }}
          RECOVERY_STATE_FILE:          ${{ runner.temp }}/vote-recovery.json
        run: |
          secret_dir="$(mktemp -d)"
          chmod 700 "$secret_dir"
          trap 'rm -rf "$secret_dir"' EXIT
          write_secret() {
            local name="$1"
            local value="$2"
            local path="$secret_dir/$name"
            printf '%s' "$value" > "$path"
            chmod 600 "$path"
            printf -v "${name}_FILE" '%s' "$path"
            export "${name}_FILE"
          }
          write_secret TOKENS "$TOKENS"
          write_secret TOPGG_COOKIES_JSON "$TOPGG_COOKIES_JSON"
          write_secret TG_BOT_TOKEN "$TG_BOT_TOKEN"
          write_secret TG_CHAT_ID "$TG_CHAT_ID"
          unset TOKENS TOPGG_COOKIES_JSON TG_BOT_TOKEN TG_CHAT_ID
          export NEXT_VOTE_STATE_FILE="$RUNNER_TEMP/next-vote.json"
          export BROWSER_RETRY_STATE_FILE="$RUNNER_TEMP/browser-startup-retry.json"
          export PROTECTION_RETRY_STATE_FILE="$RUNNER_TEMP/protection-retry.json"
          set +e
          if command -v dbus-run-session >/dev/null 2>&1; then
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x720x24" python -u vote.py
          else
            xvfb-run -a -s "-screen 0 1280x720x24" python -u vote.py
          fi
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Remove FlareSolverr and its browser profiles
        if: always()
        run: python flaresolverr_sidecar.py stop

      - name: Upload vote handoff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vote-recovery
          path: ${{ runner.temp }}/vote-recovery.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Validate cooldown schedule
        id: cooldown
        if: always()
        env:
          STATE_FILE: ${{ runner.temp }}/next-vote.json
        run: |
          if [ ! -f "$STATE_FILE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c 'import json, os, time; data=json.load(open(os.environ["STATE_FILE"], encoding="utf-8")); assert list(data) == ["next_vote_at"]; value=data["next_vote_at"]; assert type(value) is int; now=int(time.time()); assert now-86400 <= value <= now+172800'
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload cooldown schedule
        if: always() && steps.cooldown.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-vote
          path: ${{ runner.temp }}/next-vote.json
          if-no-files-found: error
          retention-days: 1

      - name: Validate browser startup retry
        id: browser-retry
        if: always()
        env:
          STATE_FILE: ${{ runner.temp }}/browser-startup-retry.json
        run: |
          if [ ! -f "$STATE_FILE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c 'import json, os; data=json.load(open(os.environ["STATE_FILE"], encoding="utf-8")); assert data == {"reason":"browser_startup_failed"}'
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload browser startup retry
        if: always() && steps.browser-retry.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-startup-retry
          path: ${{ runner.temp }}/browser-startup-retry.json
          if-no-files-found: error
          retention-days: 1

      - name: Validate protection retry
        id: protection-retry-state
        if: always()
        env:
          STATE_FILE: ${{ runner.temp }}/protection-retry.json
        run: |
          if [ ! -f "$STATE_FILE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c 'import json, os; data=json.load(open(os.environ["STATE_FILE"], encoding="utf-8")); assert data == {"reason":"protection_blocked"}'
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload protection retry
        if: always() && steps.protection-retry-state.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protection-retry
          path: ${{ runner.temp }}/protection-retry.json
          if-no-files-found: error
          retention-days: 1

      - name: Apply vote result
        if: always()
        env:
          STATUS: ${{ steps.run_vote.outputs.status }}
        run: exit "${STATUS:-1}"

  verify-vote:
    name: Check recorded vote result
    needs: vote
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check script exit status
        env:
          VOTE_STATUS: ${{ needs.vote.outputs.vote_status }}
          VOTE_JOB_RESULT: ${{ needs.vote.result }}
        run: |
          test "$VOTE_STATUS" = "0"
          # Housekeeping/upload failures cannot turn a recorded vote into a failed vote.

  failure-retry:
    # Retry business/setup failures, independently of artifact cleanup.
    needs: [vote, verify-vote]
    if: ${{ !cancelled() && needs.vote.outputs.vote_status != '0' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout retry helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch a new run after failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python action_recovery.py

  cleanup:
    continue-on-error: true
    needs: vote
    if: always() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Clear old vote workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api --paginate "repos/${{ github.repository }}/actions/workflows/vote.yml/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | .id')"
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 30 ]; then
              echo "Deleting old completed run: $run_id"
              gh run delete --repo="${{ github.repository }}" "$run_id"
            fi
          done
          echo "✅ Cleanup done — latest 30 completed vote runs kept."
