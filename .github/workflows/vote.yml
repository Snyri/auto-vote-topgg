name: Top.gg Auto Vote
run-name: Top.gg Auto Vote · ${{ inputs.source || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: manual
        type: string
      origin_run_id:
        description: Original run id that requested an automatic fresh-run retry
        required: false
        default: ''
        type: string

concurrency:
  group: topgg-vote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      vote_status: ${{ steps.run_vote.outputs.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo "No supported Chrome/Chromium executable found"; exit 1; }
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "Browser: $("$CHROME_BIN" --version)"
          echo "Xvfb: $(command -v Xvfb)"

      - name: Run vote
        id: run_vote
        env:
          TOKENS:                    ${{ secrets.TOKENS }}
          BOT_IDS:                   ${{ secrets.BOT_IDS }}
          TG_BOT_TOKEN:              ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:                ${{ secrets.TG_CHAT_ID }}
          SEND_ERROR_SCREENSHOTS:    ${{ secrets.SEND_ERROR_SCREENSHOTS }}
          TOPGG_COOKIES_JSON:        ${{ secrets.TOPGG_COOKIES_JSON }}
          RUN_SOURCE:                 ${{ inputs.source }}
          RUN_ORIGIN_ID:              ${{ inputs.origin_run_id }}
        run: |
          secret_dir="$(mktemp -d)"
          chmod 700 "$secret_dir"
          trap 'rm -rf "$secret_dir"' EXIT
          write_secret() {
            local name="$1"
            local value="$2"
            local path="$secret_dir/$name"
            printf '%s' "$value" > "$path"
            chmod 600 "$path"
            printf -v "${name}_FILE" '%s' "$path"
            export "${name}_FILE"
          }
          write_secret TOKENS "$TOKENS"
          write_secret TOPGG_COOKIES_JSON "$TOPGG_COOKIES_JSON"
          write_secret TG_BOT_TOKEN "$TG_BOT_TOKEN"
          write_secret TG_CHAT_ID "$TG_CHAT_ID"
          unset TOKENS TOPGG_COOKIES_JSON TG_BOT_TOKEN TG_CHAT_ID
          export NEXT_VOTE_STATE_FILE="$RUNNER_TEMP/next-vote.json"
          export BROWSER_RETRY_STATE_FILE="$RUNNER_TEMP/browser-startup-retry.json"
          export PROTECTION_RETRY_STATE_FILE="$RUNNER_TEMP/protection-retry.json"
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" python -u vote.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate cooldown schedule
        id: cooldown
        if: always()
        env:
          STATE_FILE: ${{ runner.temp }}/next-vote.json
        run: |
          if [ ! -f "$STATE_FILE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c 'import json, os, time; data=json.load(open(os.environ["STATE_FILE"], encoding="utf-8")); assert list(data) == ["next_vote_at"]; value=data["next_vote_at"]; assert type(value) is int; now=int(time.time()); assert now-86400 <= value <= now+172800'
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload cooldown schedule
        if: steps.cooldown.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-vote
          path: ${{ runner.temp }}/next-vote.json
          if-no-files-found: error
          retention-days: 1

      - name: Validate browser startup retry
        id: browser-retry
        if: always()
        env:
          STATE_FILE: ${{ runner.temp }}/browser-startup-retry.json
        run: |
          if [ ! -f "$STATE_FILE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c 'import json, os; data=json.load(open(os.environ["STATE_FILE"], encoding="utf-8")); assert data == {"reason":"browser_startup_failed"}'
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload browser startup retry
        if: steps.browser-retry.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-startup-retry
          path: ${{ runner.temp }}/browser-startup-retry.json
          if-no-files-found: error
          retention-days: 1

      - name: Validate protection retry
        id: protection-retry-state
        if: always()
        env:
          STATE_FILE: ${{ runner.temp }}/protection-retry.json
        run: |
          if [ ! -f "$STATE_FILE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c 'import json, os; data=json.load(open(os.environ["STATE_FILE"], encoding="utf-8")); assert data == {"reason":"protection_blocked"}'
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload protection retry
        if: steps.protection-retry-state.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protection-retry
          path: ${{ runner.temp }}/protection-retry.json
          if-no-files-found: error
          retention-days: 1

      - name: Apply vote result
        if: always()
        env:
          STATUS: ${{ steps.run_vote.outputs.status }}
        run: exit "${STATUS:-1}"

    continue-on-error: true

  verify-vote:
    needs: vote
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Apply vote result
        env:
          VOTE_STATUS: ${{ needs.vote.outputs.vote_status }}
        run: test "$VOTE_STATUS" = "0"

  browser-startup-retry:
    needs: vote
    if: always() && github.ref == 'refs/heads/master' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch one fresh-run retry when browser startup failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE: ${{ github.event.inputs.source }}
        run: |
          set -euo pipefail
          if [ "$SOURCE" = "browser-startup-retry" ] || [ "$SOURCE" = "protection-retry" ]; then
            echo "Automatic fresh-run retry already consumed; no second dispatch."
            exit 0
          fi

          artifact="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "browser-startup-retry" and .expired == false)] | first // empty')"
          artifact_id="$(jq -r '.id // empty' <<<"$artifact")"
          if [ -z "$artifact_id" ]; then
            echo "No browser startup retry marker; no dispatch."
            exit 0
          fi

          state_dir="$(mktemp -d)"
          trap 'rm -rf "$state_dir"' EXIT
          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > "$state_dir/state.zip"
          unzip -qq "$state_dir/state.zip" -d "$state_dir/unpacked"
          state_file="$state_dir/unpacked/browser-startup-retry.json"
          STATE_FILE="$state_file" python -c 'import json, os; data=json.load(open(os.environ["STATE_FILE"], encoding="utf-8")); assert data == {"reason":"browser_startup_failed"}'

          gh api --method POST "repos/$REPOSITORY/actions/workflows/vote.yml/dispatches" \
            -f "ref=$GITHUB_REF_NAME" \
            -f 'inputs[source]=browser-startup-retry' \
            -f "inputs[origin_run_id]=$RUN_ID"
          echo "Dispatched one fresh-run retry for browser startup failure from run $RUN_ID"

  protection-retry:
    needs: vote
    if: always() && github.ref == 'refs/heads/master' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch one fresh-run retry when protection persists
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE: ${{ github.event.inputs.source }}
        run: |
          set -euo pipefail
          if [ "$SOURCE" = "browser-startup-retry" ] || [ "$SOURCE" = "protection-retry" ]; then
            echo "Automatic fresh-run retry already consumed; no second dispatch."
            exit 0
          fi

          artifact="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "protection-retry" and .expired == false)] | first // empty')"
          artifact_id="$(jq -r '.id // empty' <<<"$artifact")"
          if [ -z "$artifact_id" ]; then
            echo "No protection retry marker; no dispatch."
            exit 0
          fi

          state_dir="$(mktemp -d)"
          trap 'rm -rf "$state_dir"' EXIT
          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > "$state_dir/state.zip"
          unzip -qq "$state_dir/state.zip" -d "$state_dir/unpacked"
          state_file="$state_dir/unpacked/protection-retry.json"
          STATE_FILE="$state_file" python -c 'import json, os; data=json.load(open(os.environ["STATE_FILE"], encoding="utf-8")); assert data == {"reason":"protection_blocked"}'

          gh api --method POST "repos/$REPOSITORY/actions/workflows/vote.yml/dispatches" \
            -f "ref=$GITHUB_REF_NAME" \
            -f 'inputs[source]=protection-retry' \
            -f "inputs[origin_run_id]=$RUN_ID"
          echo "Dispatched one fresh-run retry for persistent protection block from run $RUN_ID"

  cleanup:
    needs: vote
    if: always() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Clear old repository workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api --paginate "repos/${{ github.repository }}/actions/workflows/vote.yml/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | .id')"
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 10 ]; then
              echo "Deleting old completed run: $run_id"
              gh run delete --repo="${{ github.repository }}" "$run_id"
            fi
          done
          echo "✅ Cleanup done — latest 10 completed repository runs kept."
