name: Cooldown Retry Dispatcher

on:
  schedule:
    # Offset from top-of-hour load; workflow stays disabled unless cooldown exists.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

concurrency:
  group: topgg-cooldown-dispatcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch vote when cooldown is due
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          workflow="vote.yml"
          scheduler="cooldown-retry.yml"

          disable_scheduler() {
            gh api --method PUT "repos/$REPOSITORY/actions/workflows/$scheduler/disable"
          }

          vote_run="$(gh api "repos/$REPOSITORY/actions/workflows/$workflow/runs?per_page=1" --jq '.workflow_runs[0]')"
          vote_status="$(jq -r '.status // empty' <<<"$vote_run")"
          vote_run_id="$(jq -r '.id // empty' <<<"$vote_run")"
          if [ -z "$vote_run_id" ]; then
            echo "No vote workflow run found; disabling scheduler."
            disable_scheduler
            exit 0
          fi
          if [ "$vote_status" != "completed" ]; then
            echo "Vote run $vote_run_id is $vote_status; skipping this tick."
            exit 0
          fi

          artifact="$(gh api "repos/$REPOSITORY/actions/runs/$vote_run_id/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "next-vote" and .expired == false)] | sort_by(.created_at) | last // empty')"
          artifact_id="$(jq -r '.id // empty' <<<"$artifact")"
          if [ -z "$artifact_id" ]; then
            echo "Latest vote run has no cooldown artifact; disabling scheduler."
            disable_scheduler
            exit 0
          fi

          state_dir="$(mktemp -d)"
          trap 'rm -rf "$state_dir"' EXIT
          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > "$state_dir/state.zip"
          unzip -qq "$state_dir/state.zip" -d "$state_dir/unpacked"
          state_file="$state_dir/unpacked/next-vote.json"
          if [ ! -f "$state_file" ]; then
            echo "Cooldown artifact is malformed; disabling scheduler."
            disable_scheduler
            exit 0
          fi

          next_vote_at="$(jq -er 'if (keys == ["next_vote_at"]) and (.next_vote_at | type == "number") and (.next_vote_at | floor == .) then .next_vote_at else error("invalid cooldown state") end' "$state_file")" || {
            echo "Cooldown state failed validation; disabling scheduler."
            disable_scheduler
            exit 0
          }
          now="$(date +%s)"
          max_future=$((now + 86400 + 600))
          if [ "$next_vote_at" -lt $((now - 86400)) ] || [ "$next_vote_at" -gt "$max_future" ]; then
            echo "Cooldown timestamp is outside accepted range; disabling scheduler."
            disable_scheduler
            exit 0
          fi
          if [ "$now" -lt "$next_vote_at" ]; then
            echo "Cooldown not due: now=$now next_vote_at=$next_vote_at"
            exit 0
          fi

          response="$(gh api --method POST "repos/$REPOSITORY/actions/workflows/$workflow/dispatches" -f "ref=$GITHUB_REF_NAME" -f 'inputs[source]=cooldown' -F return_run_details=true)"
          run_url="$(jq -r '.html_url // empty' <<<"$response")"
          echo "Dispatched cooldown vote: ${run_url:-run URL unavailable}"
          disable_scheduler

      - name: Clear old dispatcher runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo="${{ github.repository }}" --workflow="cooldown-retry.yml" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 10 ]; then
              gh run delete --repo="${{ github.repository }}" "$run_id" || true
            fi
          done
